<style>
/* Шапка: 3 одинаковые кнопки */
.brandline .logo{align-self:flex-start}
.hb3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}
.hb3b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 10px;border-radius:10px;background:#c8161d;color:#fff;font:700 15px/1.15 Barlow,sans-serif;text-decoration:none;text-align:center;box-shadow:0 2px 6px rgba(200,22,29,.25)}
.hb3b:hover{background:#a81118}
.hb3b svg{width:20px;height:20px;flex:none}
.hb3b .ls{display:none}
@media(max-width:620px){.hb3b .lf{display:none}.hb3b .ls{display:inline}.hb3b{font-size:14px;padding:8px 6px;gap:6px}.hb3b svg{width:18px;height:18px}}
/* Баннер */
.hban{position:relative;overflow:hidden;border-radius:12px;background:#0d1013;min-height:200px;margin:0 0 10px;display:flex;align-items:center}
.hban .hcar{position:absolute;right:0;top:0;height:100%;width:62%;object-fit:cover;object-position:30% 50%;display:block;border-radius:0}
.hban:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d1013 0%,#0d1013 40%,rgba(13,16,19,.8) 58%,rgba(13,16,19,.15) 85%)}
.hbt{position:relative;z-index:1;padding:16px 16px 14px;max-width:640px}
.htag{display:inline-block;background:#c8161d;color:#fff;font:italic 800 18px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.5px;padding:6px 14px 6px 10px;transform:skewX(-12deg);margin-left:4px}
.hh{margin:8px 0 6px;color:#fff;font:italic 800 24px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.6);max-width:430px}
.hh em{color:#ffc400;font-style:italic}
.hsub{margin:0 0 12px;color:#e8e8e8;font:italic 600 14px/1.25 Barlow,sans-serif;border-left:3px solid #ffc400;padding-left:8px}
.hbr{display:flex;flex-wrap:wrap;gap:6px}
.hbr a{background:#fff;color:#15191c;border-radius:999px;padding:5px 12px;font:800 13px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.3px;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hbr a:hover{background:#ffc400}
@media(min-width:760px){.hban{min-height:220px}.hh{font-size:34px;max-width:620px}.hsub{font-size:17px}.htag{font-size:24px}.hbt{padding:24px 28px}.hbr a{font-size:16px;padding:7px 16px}}
.hero .perks{margin:0 0 10px}
/* Плашки разделов */
.grid.pls{gap:10px}
.tile.pl{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;gap:6px;min-height:128px;padding:12px 12px 12px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2b3136 0%,#15191c 60%,#0d1013 100%);overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.tile.pl .tic{position:absolute;right:-10px;bottom:-10px;width:92px;height:92px;opacity:.95;border-radius:50%}
.tile.pl .tt{align-items:flex-start;position:relative;z-index:1;color:#fff;height:100%;width:100%}
.tile.pl b{color:#fff;font:italic 800 18px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;max-width:100%;overflow-wrap:normal;word-break:normal;hyphens:manual}
.tile.pl .tt span{color:#b9c0c6;font-size:13px;margin-top:3px}
.tile.pl .tt span.go{margin-top:auto;padding-top:10px}
.tile.pl .go{display:inline-block;background:#ffc400;color:#15191c!important;font:700 13px/1 Barlow,sans-serif!important;padding:8px 12px!important;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tile.pl:hover .go{background:#ffd640}
@media(min-width:760px){.tile.pl{min-height:150px;padding:18px}.tile.pl b{font-size:24px}.tile.pl .tic{width:120px;height:120px}}
</style>
<style>
/* v2: логотипы брендов, преимущества, компактная главная */
.hbr{flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none}
.hbr::-webkit-scrollbar{display:none}
.hbr a{flex:none;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:4px 7px;height:32px;box-sizing:border-box}
.hbr a img{display:block;height:22px;width:auto;border-radius:0}
@media(min-width:760px){.hbt{max-width:820px}.hbr{gap:10px;flex-wrap:wrap;overflow:visible}.hbr a{height:44px;padding:5px 12px;border-radius:12px}.hbr a img{height:32px}}
.pk5{list-style:none;margin:0 0 10px;padding:8px 4px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;background:#fff;border:1px solid var(--line);border-radius:10px}
.pk5::-webkit-scrollbar{display:none}
.pk5 li{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:2px 12px;font:600 12.5px/1.2 Barlow,sans-serif;color:#1b2228;white-space:nowrap}
.pk5 li+li{border-left:1px solid var(--line)}
.pk5 img{width:30px;height:30px;object-fit:contain;flex:none;border-radius:0}
.pk5 img[data-img="kaspi-red"],.pk5 img[src*="kaspi-red"]{border-radius:50%;width:28px;height:28px}
@media(min-width:621px){.pk5{overflow:visible}.pk5 li{flex:1 1 0;min-width:0;white-space:normal;font-size:13.5px;gap:10px;padding:2px 10px}.pk5 img{width:38px;height:38px}}
.home .chips[role=navigation]{display:none}
.gsb{white-space:nowrap;overflow:hidden;min-height:42px;padding:9px 16px}
@media(max-width:620px){
.home .limg{height:42px}
.home .top-nav{padding-top:6px}
.home .hb3{margin-top:8px}
.home .hb3b{min-height:42px}
.gsb{font-size:14px}
.home .hero{padding-top:8px!important}
.hban{min-height:0;margin-bottom:8px}
.hbt{padding:10px 12px 10px}
.htag{font-size:14px;padding:4px 10px 4px 8px}
.hh{font-size:20px;margin:6px 0 4px}
.hsub{font-size:12px;margin-bottom:8px}
.home .hs-it{padding:4px 44px 10px}
.home .hs-it img{max-height:210px}
.home .hs-brand{padding-top:8px}
.home .hs-brand img{width:26px;height:26px}
.home .hs-brand b{font-size:16px}
}
.pk5 img{background:transparent!important}
.pk5 .ls{display:none}
.pk5 li .lf{white-space:normal;max-width:180px}
@media(max-width:620px){
.hbr{gap:5px}.hbr a{height:28px;padding:3px 5px;border-radius:8px}.hbr a img{height:19px}
.pk5{padding:8px 2px;overflow:visible}
.pk5 li{flex:1 1 0;min-width:0;flex-direction:column;gap:4px;padding:0 2px;text-align:center;white-space:normal;font-size:10px;line-height:1.15;font-weight:600}
.pk5 .lf{display:none}.pk5 .ls{display:block}
.pk5 img{width:26px;height:26px}
.pk5 img[data-img="kaspi-red"],.pk5 img[src*="kaspi-red"]{width:24px;height:24px}
.home .hs-it img{max-height:170px}
.home .hs-it{padding:2px 44px 8px}
.hh{font-size:19px}
}
</style>
